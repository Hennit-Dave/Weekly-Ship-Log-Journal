<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <title>Weekly Ship Log</title>
  <meta name="description" content="Personal journal to track and log what you ship and build each week.">
  
  <!-- Apple & Mobile Web App Meta Tags -->
  <meta name="theme-color" content="#1e1b4b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Ship Log">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>
  
  <style>
    :root {
      --primary-start: #1e1b4b;
      --primary-mid: #4338ca;
      --primary-end: #7c3aed;
      --btn-grad-start: #4f46e5;
      --btn-grad-end: #9333ea;
      --btn-grad-hover-start: #4338ca;
      --btn-grad-hover-end: #7e22ce;
      --bg-page: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --danger-color: #ef4444;
      --danger-hover-bg: #fee2e2;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.08), 0 2px 4px -2px rgb(0 0 0 / 0.06);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.08);
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(48px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      -webkit-tap-highlight-color: transparent;
    }

    .container {
      width: 100%;
      max-width: 700px;
      margin: 0 auto;
    }

    /* Header Section */
    .header-card {
      background: linear-gradient(135deg, var(--primary-start) 0%, var(--primary-mid) 50%, var(--primary-end) 100%);
      color: #ffffff;
      border-radius: var(--radius-lg);
      padding: 32px 28px;
      text-align: center;
      box-shadow: var(--shadow-lg);
      margin-bottom: 24px;
      position: relative;
      overflow: hidden;
    }

    .header-card::before {
      content: "";
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, transparent 60%);
      pointer-events: none;
    }

    .header-title {
      font-size: clamp(1.4rem, 4vw, 1.85rem);
      font-weight: 700;
      letter-spacing: -0.025em;
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .header-title .lucide {
      width: 28px;
      height: 28px;
      stroke-width: 2.25;
      color: #c7d2fe;
      flex-shrink: 0;
    }

    .header-subtitle {
      font-size: clamp(0.875rem, 2.5vw, 1rem);
      font-weight: 400;
      color: rgba(255, 255, 255, 0.85);
    }

    /* Main Content Card */
    .main-card {
      background: var(--card-bg);
      border-radius: var(--radius-lg);
      padding: 28px;
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border-color);
      margin-bottom: 24px;
    }

    /* Input Area */
    .input-section {
      display: flex;
      flex-direction: column;
    }

    .textarea-wrapper {
      position: relative;
      margin-bottom: 8px;
    }

    .log-textarea {
      width: 100%;
      height: 120px;
      padding: 14px 16px;
      font-family: inherit;
      font-size: 16px; /* 16px prevents iOS Safari from auto-zooming on focus */
      color: var(--text-main);
      background-color: #fcfdfe;
      border: 1.5px solid var(--border-color);
      border-radius: var(--radius-md);
      resize: vertical;
      min-height: 110px;
      max-height: 350px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
      line-height: 1.5;
      -webkit-appearance: none;
    }

    .log-textarea:focus {
      background-color: #ffffff;
      border-color: var(--btn-grad-start);
      box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
    }

    .log-textarea::placeholder {
      color: #94a3b8;
    }

    .textarea-meta {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      margin-bottom: 14px;
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .char-counter {
      font-variant-numeric: tabular-nums;
    }

    .save-btn {
      align-self: flex-start;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      background: linear-gradient(135deg, var(--btn-grad-start) 0%, var(--btn-grad-end) 100%);
      color: #ffffff;
      font-family: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 24px;
      min-height: 44px; /* HIG tap target standard */
      border: none;
      border-radius: var(--radius-md);
      cursor: pointer;
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25);
      transition: all 0.2s ease;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .save-btn .lucide {
      width: 18px;
      height: 18px;
      stroke-width: 2.2;
    }

    .save-btn:hover {
      background: linear-gradient(135deg, var(--btn-grad-hover-start) 0%, var(--btn-grad-hover-end) 100%);
      transform: translateY(-1px);
      box-shadow: 0 4px 10px rgba(79, 70, 229, 0.35);
    }

    .save-btn:active {
      transform: scale(0.98);
      box-shadow: 0 2px 4px rgba(79, 70, 229, 0.25);
    }

    /* Inline Error Message */
    .error-msg {
      display: none;
      color: var(--danger-color);
      font-size: 0.875rem;
      font-weight: 500;
      margin-top: 12px;
      align-items: center;
      gap: 6px;
      animation: fadeIn 0.25s ease-out;
    }

    .error-msg .lucide {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .error-msg.visible {
      display: flex;
    }

    /* Previous Entries Section */
    .entries-section {
      margin-top: 32px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
    }

    .section-title {
      font-size: 1.2rem;
      font-weight: 600;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title .lucide {
      width: 20px;
      height: 20px;
      color: var(--primary-mid);
      stroke-width: 2.2;
    }

    .entries-count-badge {
      font-size: 0.75rem;
      font-weight: 600;
      background-color: #ede9fe;
      color: var(--primary-mid);
      padding: 3px 10px;
      border-radius: 999px;
    }

    .divider {
      height: 1px;
      background-color: var(--border-color);
      margin-bottom: 20px;
      border: none;
    }

    /* Entries List */
    .entries-list {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .entry-card {
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-md);
      padding: 18px 20px;
      box-shadow: var(--shadow-sm);
      position: relative;
      transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
      animation: fadeIn 0.35s ease-out;
    }

    .entry-card:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-md);
      border-color: #cbd5e1;
    }

    .entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
      padding-bottom: 8px;
      border-bottom: 1px dashed #f1f5f9;
      gap: 8px;
    }

    .entry-date {
      font-size: 0.825rem;
      font-weight: 600;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }

    .entry-date .lucide {
      width: 14px;
      height: 14px;
      color: #94a3b8;
      flex-shrink: 0;
    }

    .delete-btn {
      background: transparent;
      border: none;
      color: #94a3b8;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 10px;
      min-height: 44px; /* HIG tap target standard */
      min-width: 44px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .delete-btn .lucide {
      width: 15px;
      height: 15px;
      stroke-width: 2;
    }

    .delete-btn:hover {
      background-color: var(--danger-hover-bg);
      color: var(--danger-color);
    }

    .delete-btn:active {
      background-color: #fecaca;
      color: #dc2626;
      transform: scale(0.95);
    }

    /* ── Edit button ── */
    .edit-btn {
      background: transparent;
      border: none;
      color: #94a3b8;           /* same muted grey as delete */
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
      padding: 8px 10px;
      min-height: 44px;
      min-width: 44px;
      border-radius: var(--radius-sm);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: all 0.2s ease;
      line-height: 1;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }

    .edit-btn:hover {
      background-color: #e2e8f0;  /* subtle dark-grey bg */
      color: #334155;             /* dark slate text */
    }

    .edit-btn:active {
      background-color: #cbd5e1;
      color: #1e293b;
      transform: scale(0.95);
    }

    /* Button group wrapper */
    .entry-actions {
      display: inline-flex;
      align-items: center;
      gap: 8px;   /* comfortable space between Edit and Delete */
      flex-shrink: 0;
    }

    .entry-content {
      font-size: 0.95rem;
      color: var(--text-main);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.6;
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: var(--text-muted);
      background-color: #f8fafc;
      border: 2px dashed #e2e8f0;
      border-radius: var(--radius-md);
      margin-top: 8px;
      animation: fadeIn 0.3s ease-out;
    }

    .empty-icon-wrapper {
      display: flex;
      justify-content: center;
      margin-bottom: 10px;
    }

    .empty-icon-lucide {
      width: 42px;
      height: 42px;
      color: var(--primary-mid);
      stroke-width: 1.75;
    }

    .empty-title {
      font-size: 1rem;
      font-weight: 600;
      color: #475569;
      margin-bottom: 4px;
    }

    /* Clear All button — ghost style, lives inside gradient header */
    .header-actions {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-top: 18px;
    }

    .clear-all-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;                             /* space between icon and text */
      padding: 9px 20px;                   /* internal breathing room */
      background: rgba(255, 255, 255, 0.12); /* semi-transparent white fill */
      color: rgba(255, 255, 255, 0.9);      /* white text to match header */
      border: 1px solid rgba(255, 255, 255, 0.3); /* soft white outline */
      font-family: inherit;
      font-size: 0.83rem;
      font-weight: 600;
      border-radius: var(--radius-sm);
      cursor: pointer;
      letter-spacing: 0.02em;
      transition: background 0.2s ease, border-color 0.2s ease, transform 0.15s ease;
      position: relative;
      z-index: 1;
      user-select: none;
      -webkit-user-select: none;
    }

    .clear-all-btn:hover {
      background: rgba(255, 255, 255, 0.22);
      border-color: rgba(255, 255, 255, 0.5);
      transform: translateY(-1px);
    }

    .clear-all-btn:active {
      background: rgba(255, 255, 255, 0.28);
      transform: translateY(0) scale(0.97);
    }

    .clear-all-btn.hidden {
      display: none;
    }

    .clear-all-btn .lucide {
      width: 14px;
      height: 14px;
      stroke-width: 2;
    }

    .edit-btn .lucide {
      width: 15px;
      height: 15px;
      stroke-width: 2;
    }

    .save-changes-btn .lucide {
      width: 15px;
      height: 15px;
      stroke-width: 2;
    }

    .cancel-edit-btn .lucide {
      width: 15px;
      height: 15px;
      stroke-width: 2;
    }

    /* Animations */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* iPhone & Mobile Responsive Styling (< 600px) */
    @media (max-width: 600px) {
      body {
        padding: max(16px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
      }

      .header-card {
        padding: 24px 18px;
        border-radius: var(--radius-md);
        margin-bottom: 16px;
      }

      .header-title {
        font-size: 1.45rem;
        gap: 8px;
      }

      .header-title .lucide {
        width: 24px;
        height: 24px;
      }

      .header-subtitle {
        font-size: 0.9rem;
      }

      .main-card {
        padding: 20px 16px;
        border-radius: var(--radius-md);
      }

      .log-textarea {
        font-size: 16px; /* Ensures no auto-zoom on iOS */
        padding: 12px 14px;
        min-height: 100px;
      }

      .save-btn {
        width: 100%;
        min-height: 48px;
        font-size: 1rem;
        padding: 14px 20px;
        border-radius: var(--radius-md);
      }

      .entries-section {
        margin-top: 24px;
      }

      .section-title {
        font-size: 1.1rem;
      }

      .entry-card {
        padding: 14px 16px;
        border-radius: var(--radius-md);
      }

      .entry-header {
        align-items: center;
      }

      .entry-date {
        font-size: 0.775rem;
      }

      .delete-btn {
        padding: 6px 10px;
        font-size: 0.8rem;
      }
    }

    /* Compact iPhone Screens (iPhone SE, iPhone mini < 380px) */
    @media (max-width: 380px) {
      .header-card {
        padding: 20px 14px;
      }

      .header-title {
        font-size: 1.3rem;
      }

      .main-card {
        padding: 16px 12px;
      }

      .entry-header {
        flex-direction: row;
        align-items: center;
        justify-content: space-between;
      }

      .entry-date {
        font-size: 0.75rem;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <header class="header-card">
      <h1 class="header-title" id="appTitle">
        <i data-lucide="notebook-pen"></i>
        <span>Weekly Ship Log</span>
      </h1>
      <p class="header-subtitle" id="appSubtitle">What did you ship this week?</p>

      <!-- FEATURE 2: Clear All Entries button -->
      <div class="header-actions">
        <button type="button" id="clearAllBtn" class="clear-all-btn hidden" aria-label="Clear all entries">
          <i data-lucide="trash-2"></i>
          <span>Clear All Entries</span>
        </button>
      </div>
    </header>

    <!-- Main Content Container -->
    <main class="main-card">
      <!-- Input Section -->
      <section class="input-section" aria-labelledby="input-heading">
        <h2 id="input-heading" class="sr-only" style="display:none;">Log New Entry</h2>
        
        <div class="textarea-wrapper">
          <textarea
            id="logInput"
            class="log-textarea"
            placeholder="I built the login feature, fixed the navbar bug, and..."
            aria-label="Journal entry progress"
            maxlength="1000"
          ></textarea>
        </div>

        <div class="textarea-meta">
          <span id="charCount" class="char-counter">0 / 1000 characters</span>
        </div>

        <button type="button" id="saveBtn" class="save-btn">
          <i data-lucide="plus-circle"></i>
          <span>Save Entry</span>
        </button>

        <div id="errorMessage" class="error-msg" role="alert" aria-live="polite">
          <i data-lucide="alert-circle"></i>
          <span>Please write something before saving.</span>
        </div>
      </section>

      <!-- Previous Entries Section -->
      <section class="entries-section" aria-labelledby="entries-heading">
        <div class="section-header">
          <h2 id="entries-heading" class="section-title">
            <i data-lucide="clipboard-list"></i>
            <span>Previous Entries</span>
          </h2>
          <span id="entryCountBadge" class="entries-count-badge" style="display: none;">0 entries</span>
        </div>
        <hr class="divider">

        <div id="entriesList" class="entries-list">
          <!-- Entries rendered here dynamically -->
        </div>

        <!-- Empty State -->
        <div id="emptyState" class="empty-state" style="display: none;">
          <div class="empty-icon-wrapper">
            <i data-lucide="rocket" class="empty-icon-lucide"></i>
          </div>
          <div class="empty-title">No entries yet. Ship something today!</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    (function () {
      const STORAGE_KEY = 'weekly_ship_log_entries';
      const MAX_CHARS = 1000;

      // DOM Elements
      const logInput = document.getElementById('logInput');
      const saveBtn = document.getElementById('saveBtn');
      const errorMessage = document.getElementById('errorMessage');
      const charCount = document.getElementById('charCount');
      const entriesList = document.getElementById('entriesList');
      const emptyState = document.getElementById('emptyState');
      const entryCountBadge = document.getElementById('entryCountBadge');

      let errorTimeout = null;

      // Refresh Lucide Icons in DOM
      function refreshIcons() {
        if (window.lucide && typeof window.lucide.createIcons === 'function') {
          window.lucide.createIcons();
        }
      }

      // Format Date according to spec: "September 1, 2026 at 3:30 PM"
      function formatEntryDate(dateObj) {
        const date = dateObj instanceof Date ? dateObj : new Date(dateObj);
        
        const dateOptions = {
          month: 'long',
          day: 'numeric',
          year: 'numeric'
        };

        const timeOptions = {
          hour: 'numeric',
          minute: '2-digit',
          hour12: true
        };

        const datePart = date.toLocaleDateString('en-US', dateOptions);
        const timePart = date.toLocaleTimeString('en-US', timeOptions);

        return `${datePart} at ${timePart}`;
      }

      // Safe LocalStorage helper functions
      function getStoredEntries() {
        try {
          const raw = localStorage.getItem(STORAGE_KEY);
          return raw ? JSON.parse(raw) : [];
        } catch (err) {
          console.error('Failed to read entries from localStorage:', err);
          return [];
        }
      }

      function saveStoredEntries(entries) {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(entries));
        } catch (err) {
          console.error('Failed to save entries to localStorage:', err);
        }
      }

      // Show inline error message temporarily (new-entry form)
      function showError(msg) {
        if (msg) {
          const span = errorMessage.querySelector('span');
          if (span) span.textContent = msg;
        }
        errorMessage.classList.add('visible');

        if (errorTimeout) clearTimeout(errorTimeout);
        errorTimeout = setTimeout(() => {
          errorMessage.classList.remove('visible');
        }, 4000);
      }

      function hideError() {
        if (errorTimeout) clearTimeout(errorTimeout);
        errorMessage.classList.remove('visible');
      }

      // ── FEATURE 1: Track which entry is currently being edited ──
      let currentlyEditingId = null;

      // ── FEATURE 2: Clear All button ──
      const clearAllBtn = document.getElementById('clearAllBtn');

      function updateClearAllVisibility(entries) {
        if (!clearAllBtn) return; // guard: element might not exist
        if (entries && entries.length > 0) {
          clearAllBtn.classList.remove('hidden');
        } else {
          clearAllBtn.classList.add('hidden');
        }
      }

      // Render Entries list
      function renderEntries() {
        const entries = getStoredEntries();
        entriesList.innerHTML = '';
        currentlyEditingId = null;

        // Update Clear All button visibility
        updateClearAllVisibility(entries);

        if (!entries || entries.length === 0) {
          emptyState.style.display = 'block';
          entryCountBadge.style.display = 'none';
          refreshIcons();
          return;
        }

        emptyState.style.display = 'none';
        entryCountBadge.textContent = `${entries.length} ${entries.length === 1 ? 'entry' : 'entries'}`;
        entryCountBadge.style.display = 'inline-block';

        // Entries are already maintained in reverse chronological order
        entries.forEach((entry) => {
          const card = document.createElement('article');
          card.className = 'entry-card';
          card.id = `entry-${entry.id}`;

          const header = document.createElement('div');
          header.className = 'entry-header';

          // Date span with optional (edited) badge
          const dateSpan = document.createElement('span');
          dateSpan.className = 'entry-date';
          dateSpan.innerHTML = `
            <i data-lucide="clock"></i>
            <span>${escapeHTML(entry.formattedDate || formatEntryDate(entry.timestamp))}</span>
            ${entry.edited ? '<span class="edited-badge">(edited)</span>' : ''}
          `;

          // ── FEATURE 1: Button group wrapping Edit + Delete ──
          const actionsDiv = document.createElement('div');
          actionsDiv.className = 'entry-actions';

          const editBtn = document.createElement('button');
          editBtn.type = 'button';
          editBtn.className = 'edit-btn';
          editBtn.setAttribute('aria-label', 'Edit this entry');
          editBtn.innerHTML = '<i data-lucide="pencil"></i> <span>Edit</span>';
          editBtn.onclick = function () { handleEditEntry(entry.id); };

          const deleteBtn = document.createElement('button');
          deleteBtn.type = 'button';
          deleteBtn.className = 'delete-btn';
          deleteBtn.setAttribute('aria-label', 'Delete this entry');
          deleteBtn.innerHTML = '<i data-lucide="trash-2"></i> <span>Delete</span>';
          deleteBtn.onclick = function () { handleDeleteEntry(entry.id); };

          actionsDiv.appendChild(editBtn);
          actionsDiv.appendChild(deleteBtn);

          header.appendChild(dateSpan);
          header.appendChild(actionsDiv);

          const contentDiv = document.createElement('div');
          contentDiv.className = 'entry-content';
          contentDiv.textContent = entry.text;

          card.appendChild(header);
          card.appendChild(contentDiv);
          entriesList.appendChild(card);
        });

        refreshIcons();
      }

      // ── FEATURE 1: Switch a card into edit mode ──
      function handleEditEntry(entryId) {
        // If another card is already being edited, cancel it first
        if (currentlyEditingId && currentlyEditingId !== entryId) {
          cancelEdit(currentlyEditingId);
        }

        currentlyEditingId = entryId;

        const entries = getStoredEntries();
        const entry = entries.find((e) => e.id === entryId);
        if (!entry) return;

        const card = document.getElementById(`entry-${entryId}`);
        if (!card) return;

        // Highlight card while editing
        card.classList.add('is-editing');

        // Replace content div with an editable textarea
        const contentDiv = card.querySelector('.entry-content');
        if (!contentDiv) return;

        const editTextarea = document.createElement('textarea');
        editTextarea.className = 'entry-edit-textarea';
        editTextarea.value = entry.text;
        editTextarea.setAttribute('aria-label', 'Edit entry text');
        editTextarea.id = `edit-textarea-${entryId}`;

        // Inline error for empty save attempt
        const editErrorMsg = document.createElement('div');
        editErrorMsg.className = 'edit-error-msg';
        editErrorMsg.id = `edit-error-${entryId}`;
        editErrorMsg.textContent = 'Entry cannot be empty.';

        card.replaceChild(editTextarea, contentDiv);
        card.appendChild(editErrorMsg);

        // Replace Edit + Delete buttons with Save Changes + Cancel
        const actionsDiv = card.querySelector('.entry-actions');
        if (actionsDiv) {
          actionsDiv.innerHTML = '';

          const saveChangesBtn = document.createElement('button');
          saveChangesBtn.type = 'button';
          saveChangesBtn.className = 'save-changes-btn';
          saveChangesBtn.setAttribute('aria-label', 'Save changes to this entry');
          saveChangesBtn.innerHTML = '<i data-lucide="save"></i> <span>Save Changes</span>';
          saveChangesBtn.onclick = function () { handleSaveChanges(entryId); };

          const cancelBtn = document.createElement('button');
          cancelBtn.type = 'button';
          cancelBtn.className = 'cancel-edit-btn';
          cancelBtn.setAttribute('aria-label', 'Cancel editing this entry');
          cancelBtn.innerHTML = '<i data-lucide="x"></i> <span>Cancel</span>';
          cancelBtn.onclick = function () { cancelEdit(entryId); };

          actionsDiv.appendChild(saveChangesBtn);
          actionsDiv.appendChild(cancelBtn);
        }

        // Keyboard shortcuts inside the edit textarea
        editTextarea.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') {
            e.preventDefault();
            cancelEdit(entryId);
          }
          if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
            e.preventDefault();
            handleSaveChanges(entryId);
          }
        });

        // Focus and move cursor to end
        editTextarea.focus();
        editTextarea.selectionStart = editTextarea.selectionEnd = editTextarea.value.length;
      }

      // ── FEATURE 1: Save the edited entry ──
      function handleSaveChanges(entryId) {
        const editTextarea = document.getElementById(`edit-textarea-${entryId}`);
        const editErrorMsg = document.getElementById(`edit-error-${entryId}`);
        if (!editTextarea) return;

        const newText = editTextarea.value.trim();

        if (!newText) {
          if (editErrorMsg) editErrorMsg.classList.add('visible');
          editTextarea.focus();
          return;
        }

        if (editErrorMsg) editErrorMsg.classList.remove('visible');

        const entries = getStoredEntries();
        const idx = entries.findIndex((e) => e.id === entryId);
        if (idx === -1) return;

        entries[idx].text = newText;
        entries[idx].edited = true;

        saveStoredEntries(entries);
        currentlyEditingId = null;
        renderEntries();
      }

      // ── FEATURE 1: Cancel editing — re-render restores original view ──
      function cancelEdit(entryId) {
        currentlyEditingId = null;
        renderEntries();
      }

      // Handle Adding a new entry
      function handleSaveEntry() {
        const text = logInput.value.trim();

        if (!text) {
          showError('Please write something before saving.');
          logInput.focus();
          return;
        }

        hideError();

        const now = new Date();
        const newEntry = {
          id: Date.now().toString(36) + Math.random().toString(36).substring(2, 7),
          text: text,
          timestamp: now.toISOString(),
          formattedDate: formatEntryDate(now)
        };

        const entries = getStoredEntries();
        // Insert at beginning for reverse chronological order
        entries.unshift(newEntry);
        saveStoredEntries(entries);

        // Reset input area
        logInput.value = '';
        updateCharCounter();
        renderEntries();
      }

      // Handle Deleting an entry with confirm prompt
      function handleDeleteEntry(entryId) {
        const confirmDelete = window.confirm('Are you sure you want to delete this log entry?');
        if (!confirmDelete) return;

        const entries = getStoredEntries();
        const updatedEntries = entries.filter((item) => item.id !== entryId);
        saveStoredEntries(updatedEntries);
        renderEntries();
      }

      // ── FEATURE 2: Clear all entries ──
      function handleClearAll() {
        const confirmed = window.confirm('Are you sure you want to delete ALL entries? This cannot be undone.');
        if (!confirmed) return;

        localStorage.removeItem(STORAGE_KEY);
        currentlyEditingId = null;
        renderEntries();
      }

      // Character counter update
      function updateCharCounter() {
        const length = logInput.value.length;
        charCount.textContent = `${length} / ${MAX_CHARS} characters`;
      }

      // Helper to escape potential HTML in strings
      function escapeHTML(str) {
        if (!str) return '';
        return str
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#039;');
      }

      // Event Listeners
      saveBtn.addEventListener('click', handleSaveEntry);
      if (clearAllBtn) clearAllBtn.addEventListener('click', handleClearAll); // guard: null-safe

      logInput.addEventListener('input', () => {
        updateCharCounter();
        if (logInput.value.trim().length > 0) {
          hideError();
        }
      });

      // Allow Ctrl+Enter or Cmd+Enter to quickly save a new entry
      logInput.addEventListener('keydown', (e) => {
        if ((e.metaKey || e.ctrlKey) && e.key === 'Enter') {
          e.preventDefault();
          handleSaveEntry();
        }
      });

      // Initial Load
      updateCharCounter();
      renderEntries();
      refreshIcons();
    })();
  </script>
</body>
</html>
